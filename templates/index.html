<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Let's Pick</title>
    <!-- Conference (Manifest/Waypoint) fonts, used by questions mode -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
    <link id="favicon" rel="icon" type="image/svg+xml" href="static/favicon-{{ mode }}.svg" />
    <link rel="stylesheet" href="static/style.css" />
        <script>
      window.userId = "{{ user_id }}";
      window.jamId = "{{ jam_id }}";
      window.initialMode = "{{ mode }}";
    </script>
  </head>
  <body class="mode-{{ mode }}">
    <!-- Mode switcher: unobtrusive gear icon + dropdown -->
    <div id="modeMenu">
      <button id="modeGear" type="button" title="Change mode" aria-label="Change mode" onclick="toggleModeMenu()">&#9881;</button>
      <ul id="modeMenuList">
        <li><button type="button" data-mode="general" onclick="setMode('general')">Anything</button></li>
        <li><button type="button" data-mode="songs" onclick="setMode('songs')">Songs</button></li>
        <li><button type="button" data-mode="questions" onclick="setMode('questions')">Questions</button></li>
      </ul>
    </div>

    <h1 id="heading">{{ {'songs': "Let's Pick a song", 'questions': "Let's Pick a question"}.get(mode, "Let's Pick a thing") }}</h1>
    <h2>{{ request.host }}/{{jam_id}}</h2>
<br/>
    <div id="submitform">
      <textarea id="songInput" rows="1" placeholder="Type a suggestion here"></textarea>
      <button onclick="submitSong()" id="submitBtn">Submit</button>
    </div>

    <p id="likePrompt">Check the box for each you like:</p>
    <ul id="songList">
      <p style="color: grey; font-style: italic;">No suggestions yet</p></br>
    </ul>
    <div id="songList2Label">
      <p>Done:</p>
    </div>
    <ul id="songList2">
      <!-- woohoo -->
    </ul>

    <img id="qr" src="qr/{{jam_id}}.png" />

    <div class="footer">
      <p>A Rob Miles (well, mostly Claude) project</p>
    </div>
    <script>
       userId = "{{ user_id }}";
       jamId = "{{ jam_id }}";
    </script>
    <script src="static/script.js"></script>
  </body>
</html>
