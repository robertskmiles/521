services:
  - type: web
    name: letspick
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Single worker + threads: all requests share one in-memory `songs` dict,
    # matching the old Glitch behaviour. More workers would each get a separate
    # copy and rooms would appear to fragment.
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
