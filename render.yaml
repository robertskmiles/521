services:
  - type: web
    name: letspick
    branch: main
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Single worker + threads: all requests share one in-memory `songs` dict,
    # matching the old Glitch behaviour. More workers would each get a separate
    # copy and rooms would appear to fragment.
    # Only 2 threads: on the free tier's 0.1 CPU, more threads just thrash on the
    # GIL (load testing showed 8 threads gave ~100 req/s vs ~125 with 2).
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
